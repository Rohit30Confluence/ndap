<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NDAP Dashboard</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --border: #232c38;
    --text: #d8e1ec;
    --muted: #8291a3;
    --accent: #4fb0ff;
    --low: #5b8fd6;
    --medium: #e0b23a;
    --high: #e0793a;
    --critical: #e0453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  header span { color: var(--muted); font-size: 13px; }
  main { padding: 24px 28px; max-width: 1000px; margin: 0 auto; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text] {
    flex: 1;
    min-width: 240px;
    background: #0e141c;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    color: #08131f;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .stats { display: flex; gap: 28px; margin-top: 4px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sev { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .sev-low { background: rgba(91,143,214,0.15); color: var(--low); }
  .sev-medium { background: rgba(224,178,58,0.15); color: var(--medium); }
  .sev-high { background: rgba(224,121,58,0.15); color: var(--high); }
  .sev-critical { background: rgba(224,69,58,0.15); color: var(--critical); }
  .mitre { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .err { color: var(--critical); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>NDAP</h1>
  <span>Network Detection & Analysis Platform</span>
</header>
<main>
  <div class="panel">
    <div class="row">
      <input id="pcapPath" type="text" placeholder="/path/to/traffic.pcap" />
      <button id="analyzeBtn" onclick="runAnalyze()">Analyze</button>
    </div>
    <div class="err" id="errBox" style="display:none"></div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="n" id="statPackets">—</div><div class="l">Packets</div></div>
      <div class="stat"><div class="n" id="statConversations">—</div><div class="l">Conversations</div></div>
      <div class="stat"><div class="n" id="statAlerts">—</div><div class="l">Alerts</div></div>
    </div>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr><th>Time</th><th>Severity</th><th>Rule</th><th>MITRE</th><th>Detail</th></tr>
      </thead>
      <tbody id="alertBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg">Run an analysis to see alerts here.</div>
  </div>
</main>

<script>
async function runAnalyze() {
  const path = document.getElementById('pcapPath').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';
  if (!path) { return; }

  btn.disabled = true;
  btn.textContent = 'Analyzing…';
  try {
    const res = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) throw new Error('server returned ' + res.status);
    const data = await res.json();
    render(data);
  } catch (e) {
    errBox.textContent = 'Request failed: ' + e.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Analyze';
  }
}

function render(data) {
  document.getElementById('statPackets').textContent = data.packets;
  document.getElementById('statConversations').textContent = data.conversations;
  document.getElementById('statAlerts').textContent = data.alerts.length;

  const body = document.getElementById('alertBody');
  const emptyMsg = document.getElementById('emptyMsg');
  body.innerHTML = '';

  if (data.alerts.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  for (const a of data.alerts) {
    const tr = document.createElement('tr');
    const sevClass = 'sev-' + a.severity.toLowerCase();
    const mitre = a.mitre_id ? `${a.mitre_id} · ${a.mitre_name}` : '—';
    tr.innerHTML = `
      <td>${a.ts_sec}</td>
      <td><span class="sev ${sevClass}">${a.severity}</span></td>
      <td>${a.rule}</td>
      <td class="mitre">${mitre}</td>
      <td>${a.message}</td>
    `;
    body.appendChild(tr);
  }
}

document.getElementById('pcapPath').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') runAnalyze();
});
</script>
</body>
</html>
