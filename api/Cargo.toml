[package]
name = "ndap-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ndap-api"
path = "src/main.rs"

[dependencies]
ndap-capture = { path = "../crates/capture" }
ndap-protocol = { path = "../crates/protocol" }
ndap-flow = { path = "../crates/flow" }
ndap-detect = { path = "../crates/detect" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
