<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NDAP Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, "SF Mono", Consolas, monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b949e; margin-bottom: 20px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card .n { font-size: 28px; font-weight: 600; }
  .card .l { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 10px; border-radius: 6px; font-family: inherit; }
  button { background: #238636; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  button:hover { background: #2ea043; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; }
  .sev-Critical { color: #f85149; font-weight: 600; }
  .sev-High { color: #f0883e; }
  .sev-Medium { color: #d29922; }
  .sev-Low { color: #58a6ff; }
  #chart-wrap { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
</style>
</head>
<body>
  <h1>NDAP — Network Detection &amp; Analysis Platform</h1>
  <div class="sub">Point this at a .pcap file on the server's filesystem and analyze it.</div>

  <form id="analyze-form">
    <input type="text" name="path" placeholder="/path/to/capture.pcap" required />
    <button type="submit">Analyze</button>
  </form>

  <div id="results">
    <div class="grid">
      <div class="card"><div class="n">—</div><div class="l">Packets</div></div>
      <div class="card"><div class="n">—</div><div class="l">Conversations</div></div>
      <div class="card"><div class="n">—</div><div class="l">Alerts</div></div>
    </div>
  </div>

<script>
// Handled with a plain fetch rather than htmx here: /analyze returns JSON
// (packets/conversations/alerts) that also feeds the Chart.js severity
// breakdown, and htmx's swap model is built for HTML fragments, not a
// JSON response consumed by two different renderers. htmx stays loaded
// above for other fragment-swap interactions as the dashboard grows.
document.getElementById('analyze-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const path = e.target.path.value;
  const res = await fetch('/analyze', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ path }),
  });
  const data = await res.json();
  renderResults(data);
});

function renderResults(data) {
  const bySeverity = {};
  for (const a of data.alerts) {
    bySeverity[a.severity] = (bySeverity[a.severity] || 0) + 1;
  }

  const rows = data.alerts.map(a => `
    <tr>
      <td>${a.ts_sec}</td>
      <td class="sev-${a.severity}">${a.severity}</td>
      <td>${a.rule}</td>
      <td>${escapeHtml(a.message)}</td>
    </tr>
  `).join('');

  document.getElementById('results').innerHTML = `
    <div class="grid">
      <div class="card"><div class="n">${data.packets}</div><div class="l">Packets</div></div>
      <div class="card"><div class="n">${data.conversations}</div><div class="l">Conversations</div></div>
      <div class="card"><div class="n">${data.alerts.length}</div><div class="l">Alerts</div></div>
    </div>
    <div id="chart-wrap"><canvas id="sevChart" height="80"></canvas></div>
    <table>
      <thead><tr><th>Time (s)</th><th>Severity</th><th>Rule</th><th>Message</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4">No alerts.</td></tr>'}</tbody>
    </table>
  `;

  const ctx = document.getElementById('sevChart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(bySeverity),
      datasets: [{ label: 'Alerts by severity', data: Object.values(bySeverity), backgroundColor: '#2ea043' }],
    },
    options: { responsive: true, plugins: { legend: { display: false } } },
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
